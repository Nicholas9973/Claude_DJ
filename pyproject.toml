[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-music-dj"
version = "0.6.0"
description = "Claude agents that pick and play music on Sonos: a DJ (Discord and a local GUI), a taste curator, and a day-plan orchestrator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "soco>=0.30",
    "claude-agent-sdk>=0.1.73",
    "discord.py>=2.4",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]   # httpx: FastAPI's test client

# Shortcuts installed into the venv (the `python -m music_agent.…` forms keep working).
[project.scripts]
dj = "music_agent.cli:main"
dj-chat = "music_agent.chat:main"
dj-bot = "music_agent.discord_bot:main"
dj-gui = "music_agent.gui.launcher:main"

[tool.setuptools.packages.find]
include = ["music_agent*"]

[tool.setuptools.package-data]
"music_agent.gui" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # discord.py imports the stdlib audio module even though we never use voice.
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM", "D"]
ignore = [
    "E501",   # long lines are allowed where wrapping hurts readability
    "D105",   # magic methods need no docstring
    "D107",   # __init__ arguments are documented in the class docstring (Google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]   # test names say what they check
